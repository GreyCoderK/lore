<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="csBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="csGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#csBg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1600" height="6" fill="url(#csGold)"/>

  <!-- Header -->
  <text x="48" y="68" font-size="44" font-weight="700" fill="#F9FAFB" letter-spacing="-0.5">Lore CLI</text>
  <text x="220" y="68" font-size="44" font-weight="300" fill="#9CA3AF">— Cheat Sheet</text>
  <text x="48" y="100" font-size="18" fill="#FBBF24" font-style="italic">Your code knows what. Lore knows why.</text>
  <text x="1552" y="68" font-size="20" font-weight="600" fill="#9CA3AF" text-anchor="end">v1.2.x</text>
  <text x="1552" y="92" font-size="14" fill="#6B7280" text-anchor="end">github.com/GreyCoderK/lore</text>

  <line x1="48" y1="125" x2="1552" y2="125" stroke="#374151" stroke-width="1"/>

  <!-- Column 1: Setup + Capture -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="170" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">⚙  Setup (one-time)</text>

    <text x="48" y="206" font-size="15" fill="#67E8F9">lore init</text>
    <text x="280" y="206" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">create .lore/, install hook</text>

    <text x="48" y="232" font-size="15" fill="#67E8F9">lore hook install / uninstall</text>
    <text x="280" y="232" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">manage post-commit hook</text>

    <text x="48" y="258" font-size="15" fill="#67E8F9">lore doctor [--fix] [--config]</text>
    <text x="280" y="258" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">diagnose / repair</text>

    <text x="48" y="284" font-size="15" fill="#67E8F9">lore config</text>
    <text x="280" y="284" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">show effective config cascade</text>

    <text x="48" y="310" font-size="15" fill="#67E8F9">lore upgrade  /  check-update</text>
    <text x="280" y="310" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">self-upgrade</text>

    <!-- Capture -->
    <text x="48" y="365" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">✍  Capture decisions</text>

    <text x="48" y="401" font-size="15" fill="#67E8F9">git commit -m "..."</text>
    <text x="280" y="401" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">hook fires → 3 + 2 questions</text>

    <text x="48" y="427" font-size="15" fill="#67E8F9">git commit -m "[doc-skip] ..."</text>
    <text x="280" y="427" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">skip silently</text>

    <text x="48" y="453" font-size="15" fill="#67E8F9">git commit --amend</text>
    <text x="280" y="453" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">[U]pdate / [C]reate / [S]kip</text>

    <text x="48" y="479" font-size="15" fill="#67E8F9">lore new [--type T] [--commit H]</text>
    <text x="280" y="479" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">manual / retroactive doc</text>

    <text x="48" y="505" font-size="15" fill="#67E8F9">lore pending  /  pending resolve</text>
    <text x="280" y="505" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">deferred commits queue</text>

    <!-- Express mode callout -->
    <rect x="48" y="525" width="490" height="78" fill="#1F2937" stroke="#FBBF24" stroke-width="1" rx="6"/>
    <text x="62" y="551" font-size="14" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">Express mode</text>
    <text x="62" y="572" font-size="13" fill="#D1D5DB" font-family="ui-sans-serif, system-ui">Answer Type / What / Why within ~3 seconds → optional</text>
    <text x="62" y="590" font-size="13" fill="#D1D5DB" font-family="ui-sans-serif, system-ui">Alternatives + Impact auto-skip. Take more time → they stay.</text>

    <!-- Search & review -->
    <text x="48" y="660" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">🔎 Search &amp; review</text>

    <text x="48" y="696" font-size="15" fill="#67E8F9">lore show [query]</text>
    <text x="280" y="696" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">fuzzy search the corpus</text>

    <text x="48" y="722" font-size="15" fill="#67E8F9">lore show --type T --tag X</text>
    <text x="280" y="722" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">filter by type / tag</text>

    <text x="48" y="748" font-size="15" fill="#67E8F9">lore list</text>
    <text x="280" y="748" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">list all docs (date desc)</text>

    <text x="48" y="774" font-size="15" fill="#67E8F9">lore status [--badge]</text>
    <text x="280" y="774" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">coverage + stats</text>

    <text x="48" y="800" font-size="15" fill="#67E8F9">lore decision --explain HEAD</text>
    <text x="280" y="800" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">why this commit scored X</text>

    <text x="48" y="826" font-size="15" fill="#67E8F9">lore release [tag]</text>
    <text x="280" y="826" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">release notes from corpus</text>
  </g>

  <!-- Column 2: Angela -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="170" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">🤖 Angela — embedded AI reviewer</text>

    <text x="600" y="200" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui" font-style="italic">draft = offline, free, zero-API. polish + review need a provider.</text>

    <text x="600" y="240" font-size="15" fill="#86EFAC">DRAFT (offline)</text>

    <text x="600" y="266" font-size="15" fill="#67E8F9">lore angela draft &lt;file&gt;</text>
    <text x="908" y="266" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">structural analysis</text>

    <text x="600" y="292" font-size="15" fill="#67E8F9">lore angela draft --all</text>
    <text x="908" y="292" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">whole corpus</text>

    <text x="600" y="318" font-size="15" fill="#67E8F9">lore angela draft --path ./docs</text>
    <text x="908" y="318" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">standalone, no init</text>

    <text x="600" y="358" font-size="15" fill="#86EFAC">POLISH (AI rewrite + diff review)</text>

    <text x="600" y="384" font-size="15" fill="#67E8F9">lore angela polish &lt;file&gt;</text>
    <text x="908" y="384" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">interactive [y/n/b/q]</text>

    <text x="600" y="410" font-size="15" fill="#67E8F9">lore angela polish --auto</text>
    <text x="908" y="410" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">auto add / reject del</text>

    <text x="600" y="436" font-size="15" fill="#67E8F9">lore angela polish --for "CTO"</text>
    <text x="908" y="436" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">audience rewrite</text>

    <text x="600" y="462" font-size="15" fill="#67E8F9">lore angela polish --persona ID</text>
    <text x="908" y="462" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">single-lens steering</text>

    <text x="600" y="488" font-size="15" fill="#67E8F9">lore angela polish --synthesize</text>
    <text x="908" y="488" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">offline (Postman, SQL...)</text>

    <text x="600" y="528" font-size="15" fill="#86EFAC">REVIEW (corpus-wide coherence)</text>

    <text x="600" y="554" font-size="15" fill="#67E8F9">lore angela review</text>
    <text x="908" y="554" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">contradictions + gaps</text>

    <text x="600" y="580" font-size="15" fill="#67E8F9">lore angela review --filter R</text>
    <text x="908" y="580" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">restrict to subset</text>

    <text x="600" y="606" font-size="15" fill="#67E8F9">lore angela review --persona ID</text>
    <text x="908" y="606" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">multi-persona (repeatable)</text>

    <text x="600" y="632" font-size="15" fill="#67E8F9">lore angela consult P &lt;file&gt;</text>
    <text x="908" y="632" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">single-persona offline check</text>

    <!-- Persona table -->
    <text x="600" y="685" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">🎭 Persona quick-pick</text>

    <text x="600" y="718" font-size="13" fill="#67E8F9">tech-writer</text>
    <text x="740" y="718" font-size="13" fill="#F9FAFB">Salou</text>
    <text x="830" y="718" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">editorial polish, prose quality</text>

    <text x="600" y="742" font-size="13" fill="#67E8F9">ux-designer</text>
    <text x="740" y="742" font-size="13" fill="#F9FAFB">Gougou</text>
    <text x="830" y="742" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">user mental models, accessibility</text>

    <text x="600" y="766" font-size="13" fill="#67E8F9">api-designer</text>
    <text x="740" y="766" font-size="13" fill="#F9FAFB">Ouattara</text>
    <text x="830" y="766" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">API contracts, HTTP semantics</text>

    <text x="600" y="790" font-size="13" fill="#67E8F9">qa-reviewer</text>
    <text x="740" y="790" font-size="13" fill="#F9FAFB">Kouamé</text>
    <text x="830" y="790" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">validation criteria, edge cases</text>

    <text x="600" y="814" font-size="13" fill="#67E8F9">architect</text>
    <text x="740" y="814" font-size="13" fill="#F9FAFB">Doumbia</text>
    <text x="830" y="814" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">system design, trade-offs</text>

    <text x="600" y="838" font-size="13" fill="#67E8F9">business-analyst</text>
    <text x="740" y="838" font-size="13" fill="#F9FAFB">Béda</text>
    <text x="830" y="838" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">requirements traceability</text>

    <text x="600" y="862" font-size="13" fill="#67E8F9">storyteller</text>
    <text x="740" y="862" font-size="13" fill="#F9FAFB">Affoué</text>
    <text x="830" y="862" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">narrative clarity, onboarding</text>
  </g>

  <!-- Column 3: Install + CI + Config -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="1140" y="170" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">📦 Install</text>

    <text x="1140" y="208" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">macOS / Linux (Homebrew)</text>
    <text x="1140" y="231" font-size="14" fill="#67E8F9">brew install GreyCoderK/tap/lore</text>

    <text x="1140" y="265" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">Any platform (Go)</text>
    <text x="1140" y="288" font-size="14" fill="#67E8F9">go install github.com/greycoderk/</text>
    <text x="1140" y="306" font-size="14" fill="#67E8F9">  lore@latest</text>

    <text x="1140" y="340" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">curl pipe (macOS / Linux)</text>
    <text x="1140" y="363" font-size="13" fill="#67E8F9">curl -sSfL https://raw.github</text>
    <text x="1140" y="381" font-size="13" fill="#67E8F9">  usercontent.com/GreyCoderK/</text>
    <text x="1140" y="399" font-size="13" fill="#67E8F9">  lore/main/install.sh | sh</text>

    <text x="1140" y="430" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">Windows: GitHub Releases binary</text>
    <text x="1140" y="448" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">(Chocolatey pending moderation)</text>

    <!-- CI integration -->
    <text x="1140" y="500" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">🔁 Angela in CI</text>

    <text x="1140" y="528" font-size="13" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">GitHub Actions — 3 lines:</text>
    <rect x="1140" y="540" width="430" height="92" fill="#0F1419" stroke="#374151" stroke-width="1" rx="4"/>
    <text x="1152" y="562" font-size="13" fill="#67E8F9">- uses: GreyCoderK/lore@v1</text>
    <text x="1152" y="582" font-size="13" fill="#67E8F9">  with:</text>
    <text x="1152" y="602" font-size="13" fill="#67E8F9">    path: ./docs</text>
    <text x="1152" y="622" font-size="13" fill="#67E8F9">    fail_on: warning</text>

    <!-- Config snippet -->
    <text x="1140" y="685" font-size="22" font-weight="700" fill="#FBBF24" font-family="ui-sans-serif, system-ui">🛠  .lorerc (essentials)</text>

    <rect x="1140" y="700" width="430" height="245" fill="#0F1419" stroke="#374151" stroke-width="1" rx="4"/>
    <text x="1152" y="722" font-size="12" fill="#FBBF24">language</text><text x="1232" y="722" font-size="12" fill="#F9FAFB">: "en"  </text><text x="1320" y="722" font-size="12" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">or "fr"</text>
    <text x="1152" y="742" font-size="12" fill="#FBBF24">ai:</text>
    <text x="1152" y="762" font-size="12" fill="#FBBF24">  provider</text><text x="1232" y="762" font-size="12" fill="#F9FAFB">: "anthropic"</text>
    <text x="1152" y="782" font-size="12" fill="#FBBF24">  model</text><text x="1232" y="782" font-size="12" fill="#F9FAFB">: "claude-sonnet-4-6"</text>
    <text x="1152" y="802" font-size="12" fill="#FBBF24">angela:</text>
    <text x="1152" y="822" font-size="12" fill="#FBBF24">  max_tokens</text><text x="1232" y="822" font-size="12" fill="#F9FAFB">: 16000</text>
    <text x="1152" y="842" font-size="12" fill="#FBBF24">decision:</text>
    <text x="1152" y="862" font-size="12" fill="#FBBF24">  threshold_full</text><text x="1252" y="862" font-size="12" fill="#F9FAFB">: 60</text>
    <text x="1152" y="882" font-size="12" fill="#FBBF24">  always_skip</text><text x="1252" y="882" font-size="12" fill="#F9FAFB">: [docs, style, ci]</text>
    <text x="1152" y="908" font-size="11" fill="#9CA3AF" font-family="ui-sans-serif, system-ui" font-style="italic">.lorerc      → committed (team)</text>
    <text x="1152" y="926" font-size="11" fill="#9CA3AF" font-family="ui-sans-serif, system-ui" font-style="italic">.lorerc.local → gitignored (API keys)</text>
  </g>

  <!-- Footer -->
  <line x1="48" y1="1015" x2="1552" y2="1015" stroke="#374151" stroke-width="1"/>

  <text x="48" y="1050" font-size="14" fill="#9CA3AF" font-family="ui-sans-serif, system-ui">📚 Full docs: <tspan fill="#FBBF24">greycoderk.github.io/lore</tspan>     |    🐛 Issues: <tspan fill="#FBBF24">github.com/GreyCoderK/lore/issues</tspan>     |    💬 Discussions: <tspan fill="#FBBF24">github.com/GreyCoderK/lore/discussions</tspan></text>
  <text x="48" y="1078" font-size="12" fill="#6B7280" font-family="ui-sans-serif, system-ui" font-style="italic">AGPL-3.0 · Built solo from Côte d'Ivoire · Bilingual EN/FR · Made to last</text>
  <text x="1552" y="1078" font-size="12" fill="#6B7280" font-family="ui-sans-serif, system-ui" text-anchor="end">v1.2.x cheat sheet · 2026-05-03</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="1094" width="1600" height="6" fill="url(#csGold)"/>
</svg>
